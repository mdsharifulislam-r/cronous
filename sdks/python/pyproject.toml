[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cronous"
dynamic = ["version"]
description = "Chronos client for Python and FastAPI: run job handlers in your app, submit immediate and delayed jobs, and manage jobs, schedules, queues and executions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["chronos", "job-scheduler", "cron", "queue", "background-jobs", "delayed-jobs", "fastapi", "worker"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "pydantic>=2"]
pydantic = ["pydantic>=2"]

[project.urls]
Homepage = "https://github.com/mdsharifulislam-r/cronous"
Documentation = "https://github.com/mdsharifulislam-r/cronous/tree/main/sdks/python#readme"
Issues = "https://github.com/mdsharifulislam-r/cronous/issues"

[tool.hatch.version]
path = "src/cronous/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cronous"]

[tool.hatch.build.targets.sdist]
include = ["src/cronous", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
ignore_missing_imports = true
