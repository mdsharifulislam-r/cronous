# Option B: Chronos only, connected to PostgreSQL and Redis you already operate.
#
#   docker compose --env-file .env -f docker/compose.external.yaml up -d --build
#
# Required in .env: DATABASE_URL, REDIS_URL. To share an existing Docker network (for
# example, the one your Postgres/Redis containers live on), add the overlay:
#
#   docker compose --env-file .env -f docker/compose.external.yaml -f docker/compose.network.yaml up -d
name: chronos

x-chronos-env: &chronos-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
  CHRONOS_NAMESPACE: ${CHRONOS_NAMESPACE:-chronos}
  CHRONOS_BOOTSTRAP_TOKEN: ${CHRONOS_BOOTSTRAP_TOKEN:-}
  CHRONOS_TRUST_PROXY: ${CHRONOS_TRUST_PROXY:-false}
  CHRONOS_CORS_ORIGINS: ${CHRONOS_CORS_ORIGINS:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CHRONOS_SCHEDULER_TICK_MS: ${CHRONOS_SCHEDULER_TICK_MS:-1000}
  CHRONOS_LEASE_MS: ${CHRONOS_LEASE_MS:-30000}
  CHRONOS_AGENT_HEARTBEAT_MS: ${CHRONOS_AGENT_HEARTBEAT_MS:-10000}
  CHRONOS_EXECUTION_RETENTION_DAYS: ${CHRONOS_EXECUTION_RETENTION_DAYS:-30}
  CHRONOS_WEBHOOK_ALLOW_PRIVATE: ${CHRONOS_WEBHOOK_ALLOW_PRIVATE:-true}
  CHRONOS_WEBHOOK_ALLOWED_CIDRS: ${CHRONOS_WEBHOOK_ALLOWED_CIDRS:-}

services:
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: chronos-server:local
    command: ["/app/bin/migrate"]
    environment: *chronos-env
    restart: "no"

  server:
    image: chronos-server:local
    restart: unless-stopped
    environment:
      <<: *chronos-env
      PORT: "8080"
      CHRONOS_EMBEDDED_SCHEDULER: ${CHRONOS_EMBEDDED_SCHEDULER:-true}
      CHRONOS_EMBEDDED_WORKER: ${CHRONOS_EMBEDDED_WORKER:-true}
      CHRONOS_WORKER_CONCURRENCY: ${CHRONOS_WORKER_CONCURRENCY:-10}
      CHRONOS_DASHBOARD_ENABLED: ${CHRONOS_DASHBOARD_ENABLED:-true}
      CHRONOS_USER_TOKEN_TTL_HOURS: ${CHRONOS_USER_TOKEN_TTL_HOURS:-12}
      CHRONOS_LOGIN_MAX_FAILURES: ${CHRONOS_LOGIN_MAX_FAILURES:-10}
      CHRONOS_LOGIN_LOCKOUT_SECONDS: ${CHRONOS_LOGIN_LOCKOUT_SECONDS:-900}
      CHRONOS_CREDENTIAL_RECHECK_MS: ${CHRONOS_CREDENTIAL_RECHECK_MS:-30000}
      CHRONOS_RATE_LIMIT_ENABLED: ${CHRONOS_RATE_LIMIT_ENABLED:-true}
      CHRONOS_RATE_LIMIT_PER_TOKEN_PER_MINUTE: ${CHRONOS_RATE_LIMIT_PER_TOKEN_PER_MINUTE:-1200}
      CHRONOS_RATE_LIMIT_ANONYMOUS_PER_MINUTE: ${CHRONOS_RATE_LIMIT_ANONYMOUS_PER_MINUTE:-120}
      CHRONOS_RATE_LIMIT_AUTH_FAILURES_PER_MINUTE: ${CHRONOS_RATE_LIMIT_AUTH_FAILURES_PER_MINUTE:-30}
      CHRONOS_EVENTS_POLL_MS: ${CHRONOS_EVENTS_POLL_MS:-1000}
      CHRONOS_EVENTS_MAX_STREAMS: ${CHRONOS_EVENTS_MAX_STREAMS:-500}
      CHRONOS_SHUTDOWN_TIMEOUT_MS: ${CHRONOS_SHUTDOWN_TIMEOUT_MS:-15000}
      CHRONOS_READINESS_TIMEOUT_MS: ${CHRONOS_READINESS_TIMEOUT_MS:-2000}
    ports:
      - "${CHRONOS_HTTP_BIND:-127.0.0.1}:${CHRONOS_HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  # Optional: central workers for Mode C jobs (run your own handler code). Enable with
  #   docker compose ... --profile workers up -d
  # Mount a directory containing your handler module (see apps/worker/examples/handlers.js).
  worker:
    image: chronos-server:local
    profiles: ["workers"]
    restart: unless-stopped
    command: ["node", "bin/worker/main.js"]
    environment:
      <<: *chronos-env
      CHRONOS_WORKER_MODES: ${CHRONOS_WORKER_MODES:-WORKER}
      CHRONOS_WORKER_CONCURRENCY: ${CHRONOS_WORKER_CONCURRENCY:-10}
      CHRONOS_WORKER_HANDLERS: /handlers/${CHRONOS_WORKER_HANDLERS_FILE:-handlers.js}
      CHRONOS_HEALTH_PORT: "8081"
    volumes:
      - ${CHRONOS_WORKER_HANDLERS_DIR:-../apps/worker/examples}:/handlers:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s

  # Optional: a standalone scheduler, for running scheduling separately from the API.
  # Set CHRONOS_EMBEDDED_SCHEDULER=false on the server when you use it.
  scheduler:
    image: chronos-server:local
    profiles: ["scale"]
    restart: unless-stopped
    command: ["node", "bin/scheduler/main.js"]
    environment:
      <<: *chronos-env
      CHRONOS_HEALTH_PORT: "8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional full dashboard (Next.js): docker compose --profile dashboard up -d
  dashboard:
    profiles: ["dashboard"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_CHRONOS_PUBLIC_URL: ${CHRONOS_PUBLIC_URL:-}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      CHRONOS_API_URL: http://server:8080
      DASHBOARD_SECURE_COOKIES: ${DASHBOARD_SECURE_COOKIES:-true}
    ports:
      - "${CHRONOS_DASHBOARD_BIND:-127.0.0.1}:${CHRONOS_DASHBOARD_PORT:-3000}:3000"
