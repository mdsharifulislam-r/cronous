# Option A: Chronos with bundled PostgreSQL and Redis, using the published images
# (ghcr.io/mdsharifulislam-r/chronos and chronos-dashboard). No source checkout needed:
#
#   curl -fsSLO https://github.com/mdsharifulislam-r/cronous/releases/latest/download/compose.yaml
#   curl -fsSL  https://github.com/mdsharifulislam-r/cronous/releases/latest/download/env.example -o .env
#   # edit .env: set POSTGRES_PASSWORD and REDIS_PASSWORD
#   docker compose up -d                          # API + built-in UI on 127.0.0.1:8080
#   docker compose --profile dashboard up -d      # + full dashboard on 127.0.0.1:3000
#
# Pin a release with CHRONOS_VERSION in .env. To build from source instead, add
# docker/compose.build.yaml (see that file).
#
# PostgreSQL and Redis are NOT published to the host. The API binds to 127.0.0.1 by
# default; put a TLS reverse proxy in front before exposing it (see docs/DEPLOYMENT_GUIDE.md).
name: chronos

x-chronos-env: &chronos-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-chronos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-chronos}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  CHRONOS_NAMESPACE: ${CHRONOS_NAMESPACE:-chronos}
  CHRONOS_BOOTSTRAP_TOKEN: ${CHRONOS_BOOTSTRAP_TOKEN:-}
  CHRONOS_TRUST_PROXY: ${CHRONOS_TRUST_PROXY:-false}
  CHRONOS_CORS_ORIGINS: ${CHRONOS_CORS_ORIGINS:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CHRONOS_SCHEDULER_TICK_MS: ${CHRONOS_SCHEDULER_TICK_MS:-1000}
  CHRONOS_LEASE_MS: ${CHRONOS_LEASE_MS:-30000}
  CHRONOS_AGENT_HEARTBEAT_MS: ${CHRONOS_AGENT_HEARTBEAT_MS:-10000}
  CHRONOS_EXECUTION_RETENTION_DAYS: ${CHRONOS_EXECUTION_RETENTION_DAYS:-30}
  CHRONOS_WEBHOOK_ALLOW_PRIVATE: ${CHRONOS_WEBHOOK_ALLOW_PRIVATE:-true}
  CHRONOS_WEBHOOK_ALLOWED_CIDRS: ${CHRONOS_WEBHOOK_ALLOWED_CIDRS:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chronos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-chronos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # AOF persistence keeps queued deliveries across restarts; noeviction is required by BullMQ.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${CHRONOS_IMAGE:-ghcr.io/mdsharifulislam-r/chronos}:${CHRONOS_VERSION:-latest}
    command: ["/app/bin/migrate"]
    environment: *chronos-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: ${CHRONOS_IMAGE:-ghcr.io/mdsharifulislam-r/chronos}:${CHRONOS_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *chronos-env
      PORT: "8080"
      CHRONOS_EMBEDDED_SCHEDULER: ${CHRONOS_EMBEDDED_SCHEDULER:-true}
      CHRONOS_EMBEDDED_WORKER: ${CHRONOS_EMBEDDED_WORKER:-true}
      CHRONOS_WORKER_CONCURRENCY: ${CHRONOS_WORKER_CONCURRENCY:-10}
      CHRONOS_DASHBOARD_ENABLED: ${CHRONOS_DASHBOARD_ENABLED:-true}
      CHRONOS_USER_TOKEN_TTL_HOURS: ${CHRONOS_USER_TOKEN_TTL_HOURS:-12}
      CHRONOS_LOGIN_MAX_FAILURES: ${CHRONOS_LOGIN_MAX_FAILURES:-10}
      CHRONOS_LOGIN_LOCKOUT_SECONDS: ${CHRONOS_LOGIN_LOCKOUT_SECONDS:-900}
      CHRONOS_CREDENTIAL_RECHECK_MS: ${CHRONOS_CREDENTIAL_RECHECK_MS:-30000}
      CHRONOS_RATE_LIMIT_ENABLED: ${CHRONOS_RATE_LIMIT_ENABLED:-true}
      CHRONOS_RATE_LIMIT_PER_TOKEN_PER_MINUTE: ${CHRONOS_RATE_LIMIT_PER_TOKEN_PER_MINUTE:-1200}
      CHRONOS_RATE_LIMIT_ANONYMOUS_PER_MINUTE: ${CHRONOS_RATE_LIMIT_ANONYMOUS_PER_MINUTE:-120}
      CHRONOS_RATE_LIMIT_AUTH_FAILURES_PER_MINUTE: ${CHRONOS_RATE_LIMIT_AUTH_FAILURES_PER_MINUTE:-30}
      CHRONOS_EVENTS_POLL_MS: ${CHRONOS_EVENTS_POLL_MS:-1000}
      CHRONOS_EVENTS_MAX_STREAMS: ${CHRONOS_EVENTS_MAX_STREAMS:-500}
      CHRONOS_SHUTDOWN_TIMEOUT_MS: ${CHRONOS_SHUTDOWN_TIMEOUT_MS:-15000}
      CHRONOS_READINESS_TIMEOUT_MS: ${CHRONOS_READINESS_TIMEOUT_MS:-2000}
    ports:
      - "${CHRONOS_HTTP_BIND:-127.0.0.1}:${CHRONOS_HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  # Optional: central workers for Mode C jobs (run your own handler code). Enable with
  #   docker compose ... --profile workers up -d
  # Mount a directory containing your handler module (see apps/worker/examples/handlers.js).
  worker:
    image: ${CHRONOS_IMAGE:-ghcr.io/mdsharifulislam-r/chronos}:${CHRONOS_VERSION:-latest}
    profiles: ["workers"]
    restart: unless-stopped
    command: ["node", "bin/worker/main.js"]
    environment:
      <<: *chronos-env
      CHRONOS_WORKER_MODES: ${CHRONOS_WORKER_MODES:-WORKER}
      CHRONOS_WORKER_CONCURRENCY: ${CHRONOS_WORKER_CONCURRENCY:-10}
      CHRONOS_WORKER_HANDLERS: /handlers/${CHRONOS_WORKER_HANDLERS_FILE:-handlers.js}
      CHRONOS_HEALTH_PORT: "8081"
    volumes:
      - ${CHRONOS_WORKER_HANDLERS_DIR:-./handlers}:/handlers:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s

  # Optional: a standalone scheduler, for running scheduling separately from the API.
  # Set CHRONOS_EMBEDDED_SCHEDULER=false on the server when you use it.
  scheduler:
    image: ${CHRONOS_IMAGE:-ghcr.io/mdsharifulislam-r/chronos}:${CHRONOS_VERSION:-latest}
    profiles: ["scale"]
    restart: unless-stopped
    command: ["node", "bin/scheduler/main.js"]
    environment:
      <<: *chronos-env
      CHRONOS_HEALTH_PORT: "8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional full dashboard (Next.js): docker compose --profile dashboard up -d
  dashboard:
    profiles: ["dashboard"]
    image: ${CHRONOS_DASHBOARD_IMAGE:-ghcr.io/mdsharifulislam-r/chronos-dashboard}:${CHRONOS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      CHRONOS_API_URL: http://server:8080
      DASHBOARD_SECURE_COOKIES: ${DASHBOARD_SECURE_COOKIES:-true}
      CHRONOS_PUBLIC_URL: ${CHRONOS_PUBLIC_URL:-}
    ports:
      - "${CHRONOS_DASHBOARD_BIND:-127.0.0.1}:${CHRONOS_DASHBOARD_PORT:-3000}:3000"

volumes:
  postgres-data:
  redis-data:
