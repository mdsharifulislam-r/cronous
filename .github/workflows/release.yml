name: Release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to publish:
#   ghcr.io/<owner>/chronos:<version>            server, scheduler, worker, migrations
#   ghcr.io/<owner>/chronos-dashboard:<version>  Next.js dashboard
# for linux/amd64 and linux/arm64, the Node.js SDK to npm (needs the NPM_TOKEN secret),
# and a GitHub release with compose.yaml and env.example.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: chronos
            dockerfile: docker/Dockerfile
            title: Chronos
            description: Self-hosted distributed job scheduler (server, scheduler, worker)
          - image: chronos-dashboard
            dockerfile: docker/Dockerfile.dashboard
            title: Chronos Dashboard
            description: Web dashboard for Chronos
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

  npm:
    name: Publish SDK to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        working-directory: packages/sdk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/SDK_VERSION = '[^']*'/SDK_VERSION = '$VERSION'/" src/version.ts
      - run: pnpm turbo run build test --filter=./packages/sdk...
      - name: Publish
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::Add an npm automation token as the NPM_TOKEN repository secret"; exit 1; fi
          TAG=latest
          case "$GITHUB_REF_NAME" in *-*) TAG=next ;; esac
          pnpm publish --access public --tag "$TAG" --no-git-checks

  release:
    name: GitHub release
    needs: [images, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # compose.yaml and env.example default to this release's images.
          sed -e "s/\${CHRONOS_VERSION:-latest}/\${CHRONOS_VERSION:-$VERSION}/g" docker/compose.yaml > dist/compose.yaml
          sed -e "s/\${CHRONOS_VERSION:-latest}/\${CHRONOS_VERSION:-$VERSION}/g" docker/compose.external.yaml > dist/compose.external.yaml
          cp docker/compose.network.yaml dist/compose.network.yaml
          sed -e "s/^CHRONOS_VERSION=.*/CHRONOS_VERSION=$VERSION/" .env.example > dist/env.example
          # Release notes: the CHANGELOG section for this version, else [Unreleased].
          section() { awk -v h="## [$1]" 'index($0, h) == 1 { on=1; next } /^## \[/ { on=0 } on' CHANGELOG.md; }
          section "$VERSION" > dist/notes.md
          [ -s dist/notes.md ] || section Unreleased > dist/notes.md
          {
            echo
            echo "## Run it"
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/compose.yaml"
            echo "curl -fsSL  https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/env.example -o .env"
            echo "# edit .env: set POSTGRES_PASSWORD and REDIS_PASSWORD"
            echo "docker compose up -d"
            echo '```'
            echo
            echo "Images: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/chronos:${VERSION}\` and \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/chronos-dashboard:${VERSION}\` (linux/amd64, linux/arm64)."
          } >> dist/notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $PRERELEASE --verify-tag \
            --title "Chronos ${GITHUB_REF_NAME}" --notes-file dist/notes.md \
            dist/compose.yaml dist/compose.external.yaml dist/compose.network.yaml dist/env.example
