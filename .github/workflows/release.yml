name: Release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to publish:
#   cronouss/cronous:<version>             server, scheduler, worker, migrations (Docker Hub)
#   cronouss/cronous-dashboard:<version>   Next.js dashboard (Docker Hub)
# for linux/amd64 and linux/arm64, the Node.js SDK to npm, and a GitHub release with
# compose.yaml and env.example.
#
# Repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Docker Hub access token with
# read/write access), NPM_TOKEN (npm granular token with read/write access).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each platform builds natively (arm64 on GitHub's ARM runners; QEMU emulation crashes
  # Node during pnpm install) and pushes by digest. The merge job then creates the tags.
  images:
    name: Build ${{ matrix.repo }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: server, repo: cronouss/cronous, dockerfile: docker/Dockerfile, arch: amd64, runner: ubuntu-24.04 }
          - { key: server, repo: cronouss/cronous, dockerfile: docker/Dockerfile, arch: arm64, runner: ubuntu-24.04-arm }
          - { key: dashboard, repo: cronouss/cronous-dashboard, dockerfile: docker/Dockerfile.dashboard, arch: amd64, runner: ubuntu-24.04 }
          - { key: dashboard, repo: cronouss/cronous-dashboard, dockerfile: docker/Dockerfile.dashboard, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets"; exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ matrix.repo }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=docker.io/${{ matrix.repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.key }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.key }}-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.key }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Tag ${{ matrix.repo }}
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { key: server, repo: cronouss/cronous }
          - { key: dashboard, repo: cronouss/cronous-dashboard }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.key }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ matrix.repo }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Create multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") $(printf 'docker.io/${{ matrix.repo }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect "docker.io/${{ matrix.repo }}:${{ steps.meta.outputs.version }}"

  npm:
    name: Publish SDK to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        working-directory: packages/sdk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/SDK_VERSION = '[^']*'/SDK_VERSION = '$VERSION'/" src/version.ts
      - run: pnpm turbo run build test --filter=./packages/sdk...
      - name: Publish
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          # Re-running a release (or a new repository) must not fail on an existing version.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping"; exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::error::Add an npm token as the NPM_TOKEN repository secret"; exit 1; fi
          TAG=latest
          case "$GITHUB_REF_NAME" in *-*) TAG=next ;; esac
          # Shows which npm account the token belongs to (fails clearly on a bad token).
          NPM_USER="$(npm whoami)"
          echo "Publishing as npm user: $NPM_USER"
          # pnpm pack rewrites workspace: ranges; npm publishes with provenance.
          pnpm pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP"/*.tgz --access public --tag "$TAG" --provenance

  release:
    name: GitHub release
    needs: [manifests, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # compose.yaml and env.example default to this release's images.
          sed -e "s/\${CHRONOS_VERSION:-latest}/\${CHRONOS_VERSION:-$VERSION}/g" docker/compose.yaml > dist/compose.yaml
          sed -e "s/\${CHRONOS_VERSION:-latest}/\${CHRONOS_VERSION:-$VERSION}/g" docker/compose.external.yaml > dist/compose.external.yaml
          cp docker/compose.network.yaml dist/compose.network.yaml
          sed -e "s/^CHRONOS_VERSION=.*/CHRONOS_VERSION=$VERSION/" .env.example > dist/env.example
          # Release notes: the CHANGELOG section for this version, else [Unreleased].
          section() { awk -v h="## [$1]" 'index($0, h) == 1 { on=1; next } /^## \[/ { on=0 } on' CHANGELOG.md; }
          section "$VERSION" > dist/notes.md
          [ -s dist/notes.md ] || section Unreleased > dist/notes.md
          {
            echo
            echo "## Run it"
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/compose.yaml"
            echo "curl -fsSL  https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/env.example -o .env"
            echo "# edit .env: set POSTGRES_PASSWORD and REDIS_PASSWORD"
            echo "docker compose up -d"
            echo '```'
            echo
            echo "Docker Hub images: \`cronouss/cronous:${VERSION}\` and \`cronouss/cronous-dashboard:${VERSION}\` (linux/amd64, linux/arm64)."
          } >> dist/notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $PRERELEASE --verify-tag \
            --title "Chronos ${GITHUB_REF_NAME}" --notes-file dist/notes.md \
            dist/compose.yaml dist/compose.external.yaml dist/compose.network.yaml dist/env.example
