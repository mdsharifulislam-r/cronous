name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues:** do not file them here; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 0.1.0 or a1b2c3d
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Server / API, Scheduler, Worker, SDK (@cronous/cronous), Dashboard, Docker / deployment, Documentation]
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker Compose (bundled PostgreSQL/Redis), Docker Compose (external infrastructure), Local development, Other]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (remove secrets; include request IDs if you have them)
      render: text
